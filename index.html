  .wrap {
    width: min(900px, 94%);
    margin: 0 auto;
    padding: 45px 0 55px;
  }

  .brand {
    text-align: center;
    color: #fff;
    margin-bottom: 30px;
  }

  .brand-logo {
    width: 210px;
    height: 150px;
    object-fit: contain;
    display: block;
    margin: 0 auto 18px;
  }

  .brand h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(30px, 5vw, 46px);
    line-height: 1.1;
    letter-spacing: .2px;
  }

  .card {
    background: rgba(255,255,255,.98);
    border-radius: 20px;
    box-shadow: 0 18px 55px rgba(0,0,0,.22);
    padding: 34px;
  }

  form { padding: 0; }

  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px 24px;
  }

  .full { grid-column: 1 / -1; }

  label {
    display: block;
    font-weight: 800;
    margin-bottom: 8px;
    font-size: 15px;
  }

  input, textarea {
    width: 100%;
    border: 1.5px solid #d2d9e8;
    border-radius: 12px;
    padding: 14px 15px;
    font: inherit;
    color: #172033;
    outline: none;
    background: #fff;
  }

  input {
    min-height: 52px;
  }

  textarea {
    min-height: 125px;
    resize: vertical;
  }

  input:focus, textarea:focus {
    border-color: #29459b;
    box-shadow: 0 0 0 3px rgba(41,69,155,.12);
  }

  input::placeholder, textarea::placeholder {
    color: #a6aab1;
  }

  .required { color: #d52b2b; }

  .hint {
    color: #6d7585;
    font-size: 13px;
    margin-top: 7px;
  }

  .actions {
    margin-top: 28px;
    display: flex;
    justify-content: center;
  }

  button {
    border: 0;
    border-radius: 12px;
    padding: 15px 24px;
    font-weight: 800;
    cursor: pointer;
    font-size: 16px;
  }

  .save {
    background: #29459b;
    color: #fff;
    width: min(560px, 100%);
    box-shadow: 0 7px 18px rgba(41,69,155,.24);
  }

  .save:hover { background: #203985; }
  .save:disabled { opacity: .55; cursor: wait; }

  .reset { display: none; }

  .status {
    margin: 0 0 22px;
    padding: 13px 15px;
    border-radius: 10px;
    display: none;
    font-size: 14px;
    line-height: 1.45;
  }

  .status.success {
    display: block;
    background: #eaf8ef;
    color: #176b36;
  }

  .status.error {
    display: block;
    background: #fff0f0;
    color: #a51f1f;
  }

  @media (max-width: 650px) {
    .wrap { padding-top: 28px; }
    .brand-logo { width: 170px; height: 120px; }
    .brand h1 { font-size: 30px; }
    .card { padding: 23px 18px; }
    .grid { grid-template-columns: 1fr; }
    .full { grid-column: auto; }
  }
</style>
</head>

<body>
<div class="wrap">

      <h1>Greek To Go Taverna Guest Registration</h1>
    </div>



    <div id="status" class="status"></div>

    <form id="registrationForm">
      <div class="grid">
        <div class="full">
          <label for="name">Name <span class="required">*</span></label>
          <input id="name" name="name" type="text" required autocomplete="name"
                 placeholder="Customer name">
        </div>

        <div>
          <label for="phone">Phone <span class="required">*</span></label>
          <input id="phone" name="phone" type="tel" required autocomplete="tel"
                 placeholder="+63 ...">
        </div>

        <div>
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email"
                 placeholder="customer@email.com">
        </div>

        <div>
          <label for="birthday">Birthday</label>
          <input id="birthday" name="birthday" type="date">
        </div>

        <div>
          <label for="city">City</label>
          <input id="city" name="city" type="text" autocomplete="address-level2"
                 placeholder="City">
        </div>

        <div>
          <label for="favorite">Favorite</label>
          <input id="favorite" name="favorite" type="text"
                 placeholder="Favorite dish / drink">
        </div>

        

        <div>
          <label for="tags">Tags</label>
          <input id="tags" name="tags" type="text"
                 placeholder="e.g. birthday, family, delivery">
          <div class="hint">Separate multiple tags with commas.</div>
        </div>

        <div class="full">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes"
                    placeholder="Customer preferences, notes, special occasions..."></textarea>
        </div>
      </div>

      <div class="actions">
        <button type="submit" class="save" id="saveBtn">Register Guest</button>
        <button type="reset" class="reset">Clear</button>
      </div>
    </form>
  </div>
</div>

<script>
/*
  Google Sheets CRM connection.
  Paste your existing Apps Script Web App /exec URL below once.
*/
const GOOGLE_SCRIPT_URL = "PASTE_YOUR_EXISTING_GOOGLE_APPS_SCRIPT_EXEC_URL_HERE";

const form = document.getElementById("registrationForm");
const saveBtn = document.getElementById("saveBtn");
const statusBox = document.getElementById("status");

function showStatus(message, type) {
  statusBox.textContent = message;
  statusBox.className = "status " + type;
}

function createId() {
  return "GTG-" +
    Date.now().toString(36).toUpperCase() +
    "-" +
    Math.random().toString(36).substring(2, 7).toUpperCase();
}

function formatDateTime(date) {
  const pad = n => String(n).padStart(2, "0");
  return date.getFullYear() + "-" +
    pad(date.getMonth() + 1) + "-" +
    pad(date.getDate()) + " " +
    pad(date.getHours()) + ":" +
    pad(date.getMinutes()) + ":" +
    pad(date.getSeconds());
}

form.addEventListener("submit", async function(event) {
  event.preventDefault();

  if (!GOOGLE_SCRIPT_URL ||
      GOOGLE_SCRIPT_URL.includes("PASTE_YOUR_EXISTING")) {
    showStatus(
      "Google Sheets is not configured yet. Add your existing Apps Script /exec URL in the HTML.",
      "error"
    );
    return;
  }

  const name = document.getElementById("name").value.trim();
  const phone = document.getElementById("phone").value.trim();

  if (!name || !phone) {
    showStatus("Name and phone are required.", "error");
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = "Registering...";
  showStatus("Saving guest to the CRM...", "success");

  try {
    const getResponse = await fetch(
      GOOGLE_SCRIPT_URL + "?action=getGuests&ts=" + Date.now(),
      { method: "GET", cache: "no-store", redirect: "follow" }
    );

    if (!getResponse.ok) {
      throw new Error("Could not read the CRM. HTTP " + getResponse.status);
    }

    const getData = await getResponse.json();

    if (!getData || !Array.isArray(getData.guests)) {
      throw new Error("Invalid response from Google Apps Script.");
    }

    const guests = getData.guests;
    const normalizedPhone = phone.replace(/\D/g, "");

    const duplicate = guests.find(function(g) {
      return String(g.phone || "").replace(/\D/g, "") === normalizedPhone &&
             normalizedPhone !== "";
    });

    if (duplicate) {
      throw new Error(
        "This phone number is already registered" +
        (duplicate.name ? " for " + duplicate.name + "." : ".")
      );
    }

    const newGuest = {
      id: createId(),
      name: name,
      phone: phone,
      email: document.getElementById("email").value.trim(),
      visits: 0,
      lastVisit: "",
      totalSpent: 0,
      favorite: document.getElementById("favorite").value.trim(),
      notes: document.getElementById("notes").value.trim(),
      birthday: document.getElementById("birthday").value,
      segment: "",
      tags: document.getElementById("tags").value
        .split(",")
        .map(tag => tag.trim())
        .filter(Boolean),
      city: document.getElementById("city").value.trim(),
      joinDate: formatDateTime(new Date())
    };

    guests.push(newGuest);

    const postResponse = await fetch(GOOGLE_SCRIPT_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ guests: guests }),
      redirect: "follow"
    });

    if (!postResponse.ok) {
      throw new Error("Could not save the CRM. HTTP " + postResponse.status);
    }

    const result = await postResponse.json();

    if (!result || result.status !== "ok") {
      throw new Error("Google Apps Script did not confirm the save.");
    }

    form.reset();
    showStatus(
      "✓ Guest registered successfully. CRM ID: " + newGuest.id,
      "success"
    );

  } catch (error) {
    console.error(error);
    showStatus("Registration failed: " + error.message, "error");
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = "Register Guest";
  }
});
</script>
</body>
</html>
